name: API tests

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: api-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint & typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format:check

  local:
    name: Local Restful-Booker (Docker)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run server:up
      - run: npm test

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report
          path: reports
          retention-days: 14

      - uses: actions/upload-pages-artifact@v5
        if: always() && github.ref == 'refs/heads/main'
        with:
          path: reports/html

      - if: always()
        run: npm run server:down

  public:
    name: Public Restful-Booker (herokuapp)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:public

  report:
    name: Publish report
    needs: local
    if: always() && github.ref == 'refs/heads/main' && needs.local.result != 'skipped'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5
